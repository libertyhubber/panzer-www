{% extends "base.html" %}

{% block content %}
<form id="gallery-filters" role="search" onsubmit="return false">
  <label class="filter-reactions">
    <span class="filter-input-prefix" aria-hidden="true">Reaktionen</span>
    <input id="filter-reactions" aria-label="Mindestens Reaktionen" type="number" min="0" step="1" value="0">
  </label>
  <label class="filter-template">
    <select id="filter-template" aria-label="Vorlage" disabled><option value="">Alle Vorlagen</option></select>
  </label>
  <label class="filter-search">
    <input id="filter-search" aria-label="Suche" type="search" placeholder="Schlagwörter durchsuchen (Volltextsuche wird geladen…)">
  </label>
  <p id="filter-status" role="status" aria-live="polite"></p>
</form>
<div id="gallery"></div>
{% endblock %}

{% block scripts %}
<script type="module">
import PhotoSwipeLightbox from '/assets/photoswipe-lightbox.esm.js';

const lightbox = new PhotoSwipeLightbox({
  pswpModule: () => import('/assets/photoswipe.esm.js'),
  loop: false,
  closeTitle: 'Schließen',
  zoomTitle: 'Vergrößern / verkleinern',
  arrowPrevTitle: 'Vorheriges Bild',
  arrowNextTitle: 'Nächstes Bild',
  errorMsg: 'Das Bild konnte nicht geladen werden.',
})

window.lightbox = lightbox;

// const CB = Math.random().toString(36).slice(2); // Cachebust
window.CB = parseInt(+new Date() / (1000 * 3600)).toString(36)

const CACHE = {}

async function fetchJson(path) {
  if (!CACHE[path]) {
    CACHE[path] = fetch(path + "?cb=" + CB).then(response => {
      if (!response.ok) {
        throw new Error(`HTTP ${response.status} loading ${path}`)
      }
      return response.json()
    }).catch(error => {
      delete CACHE[path]
      throw error
    })
  }
  return CACHE[path]
}

window.fetchJson = fetchJson;

const appNode = document.createElement("script")
appNode.setAttribute("type", "text/javascript")
appNode.setAttribute("src", "/assets/app.js?cb=43")
document.body.appendChild(appNode)

appNode.addEventListener("load", function(){
    lightbox.init()
})

window.IMG_HOSTS = {
    "2021": "https://archiv0.derrosarotepanzer.com",
    "2022": "https://archiv0.derrosarotepanzer.com",
    "2023": "https://archiv0.derrosarotepanzer.com",
    "2024": "https://archiv0.derrosarotepanzer.com",
    "2025": "https://archiv1.derrosarotepanzer.com",
    "2026": "https://archiv2.derrosarotepanzer.com",
    "2027": "https://archiv3.derrosarotepanzer.com",
    "2028": "https://archiv4.derrosarotepanzer.com",
    "2029": "https://archiv5.derrosarotepanzer.com",
    "2030": "https://archiv6.derrosarotepanzer.com",
    "2031": "https://archiv7.derrosarotepanzer.com",
    "2032": "https://archiv8.derrosarotepanzer.com",
    "2033": "https://archiv9.derrosarotepanzer.com",
};

</script>

<link rel="preload" as="style" onload="this.onload=null;this.rel='stylesheet'" href="/assets/photoswipe.css">
<link rel="modulepreload" href="/assets/photoswipe.esm.js">
{% endblock %}
